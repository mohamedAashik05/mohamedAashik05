<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Mohamed Aashik banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <style>
      .name { font: 700 58px 'Segoe UI', Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .sub  { font: 500 20px 'Segoe UI', Arial, Helvetica, sans-serif; fill: #bfe9ff; letter-spacing: 1.5px; }
      .fade { animation: fadeIn 1.4s ease-out both; }
      .float1 { animation: float 7s ease-in-out infinite; }
      .float2 { animation: float 9s ease-in-out infinite reverse; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    </style>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <g opacity="0.18">
    <circle class="float1" cx="120" cy="60" r="70" fill="#36BCF7"/>
    <circle class="float2" cx="880" cy="200" r="90" fill="#7C5CFF"/>
    <circle class="float1" cx="780" cy="40" r="35" fill="#36BCF7"/>
  </g>

  <text class="name fade" x="500" y="118" text-anchor="middle">Mohamed Aashik</text>
  <rect x="420" y="136" width="160" height="4" rx="2" fill="url(#accent)"/>
  <text class="sub fade" x="500" y="180" text-anchor="middle">.NET Full-Stack Developer  •  AI-Powered Apps  •  RAG &amp; MCP</text>
</svg>
